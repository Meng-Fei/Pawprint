<title>Reading example</title>

<body>
<!-- the time stamp makes the browser fetch the current files, never an old copy -->
<script>for(const f of['deck.js','../engine/boot.js'])document.write(`<script src="${f}?t=${Date.now()}"><\/script>`)</script>
</body>
